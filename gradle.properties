# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: config cache breaks IDEA sync with composite includeBuilds.
org.gradle.configuration-cache=false

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.94

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=bobbypipes
# The human-readable display name for the mod.
mod_name=BobbyPipes
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=LGPL-3.0-only
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.bobby.bobbypipes

dev_player_name=BobbyPipes
dev_player_name_2=BobbyPipes2

# Optional JEI (soft dependency for pattern ghost fill)
# AE2 26.1.10-beta requires [29.5.0.26,)
jei_version=29.5.0.26

# Optional Jade (WAILA successor) - hover tooltips / future network bridge info
jade_version=26.1.8+neoforge

# Optional AE2 - explore network bridge / storage bus interop
ae2_version=26.1.10-beta

# Optional Refined Storage - explore network bridge interop (MC 26.1.2 NeoForge)
# CurseForge project 243076; file refinedstorage-neoforge-3.2.1
refinedstorage_file=8211383

# Optional Just Dire Things (localRuntime only - FE/fluid test endpoints in runClient)
# CurseForge project 1002348, file JustDireThings-1.6.11 for MC 26.1.2
justdirethings_file=8251776

# Optional Iron Tanks / Energized Power (localRuntime - fluid tanks + FE machines)
# Modrinth version numbers for MC 26.1.2 NeoForge
irontanks_version=3.3.0+mc26.1.2.neoforge
energizedpower_version=2.18.3+26.1.x-neoforge

# Optional Ender IO (localRuntime - machines, conduits, FE/fluid endpoints)
# Only alpha builds exist for this MC line; bump when a beta/release lands.
enderio_version=v9.0.5-alpha

bobbycore_version=0.1.0

# Optional Patchouli (guide book) — same line as BobbyChests
patchouli_version=26.1-94-SNAPSHOT

