pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Optional sibling for runClient. Use canonical path so IDEA sync keys match on-disk casing.
def bobbyChests = [file('../BobbyChests'), file('../bobbychests')].find { it.exists() }
if (bobbyChests != null) {
    includeBuild bobbyChests.canonicalFile
}

def bobbyCore = [file('../BobbyCore'), file('../bobbycore')].find { it.exists() }
if (bobbyCore != null) {
    includeBuild bobbyCore.canonicalFile
}
