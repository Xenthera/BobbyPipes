license="${mod_license}"
issueTrackerURL="https://github.com/VoiceLessQ/bobbypipes/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Bobby Lucero"
description='''
Request-driven item routing, modular chassis pipes, and recursive crafting for modern Minecraft.

Items move when you ask for them, not before. Built natively for NeoForge.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
