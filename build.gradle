plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // Datagen cache files. Resource excludes are relative to each source directory, not to
    // the project, so a "src/generated/..." pattern never matched and the cache shipped
    // inside the mod jar the moment datagen produced anything.
    exclude("**/.cache/**")
}

// Local CC:Tweaked jars for soft-optional ComputerCraft peripherals (compile + runClient).
// Maven (maven.squiddev.cc) has a known packaging issue for this MC line; use local jars.
def extraModsDir = "extra-mods"
def extraLibsDir = "extra-libs"

repositories {
    // Needed for JUnit. Minecraft and NeoForge come from the moddev plugin's own repos.
    mavenCentral()
    flatDir {
        name "extra-mods"
        dir file(extraModsDir)
    }
    flatDir {
        name "extra-libs"
        dir file(extraLibsDir)
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'vazkii.patchouli'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

// Give the test source set everything main has, Minecraft and NeoForge included.
// Without this, tests cannot even name an ItemResource, which is why the crafting
// chain was previously covered by a hand written stand in rather than the real code.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            programArguments.addAll '--username', (findProperty('dev_player_name') ?: 'BobbyPipes').toString()


            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Second client for LAN / multiplayer testing (separate game dir + username).
        client2 {
            client()
            gameDirectory = project.file('runs/client2')
            programArguments.addAll '--username', (findProperty('dev_player_name_2') ?: 'BobbyPipes2').toString()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Runs JUnit inside an FML environment. Patched Minecraft classes consult FML during
    // static init, so without this a test cannot even touch SharedConstants. Declared
    // after mods{} because it references the mod defined there.
    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The routing core carries no Minecraft types on purpose, so it is covered by plain
    // unit tests rather than gametests. These run without a game runtime.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Optional JEI: API at compile time, full jar for runClient/local testing only.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Optional Jade (ex-WAILA): no separate API jar; full mod for compile + runClient.
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // Optional AE2: API at compile time, full mod (+ GuideME transitive) for runClient.
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // Optional Refined Storage (CurseMaven - no public NeoForge maven for 3.x yet).
    compileOnly "curse.maven:refined-storage-243076:${refinedstorage_file}"
    localRuntime "curse.maven:refined-storage-243076:${refinedstorage_file}"

    // Optional ComputerCraft:Tweaked — local jars in extra-libs / extra-mods (Maven broken for this build).
    addLocalArtifacts('compileOnly', extraLibsDir, "extra-libs")
    addLocalArtifacts('localRuntime', extraModsDir)

    // Optional Patchouli: API at compile time, full mod for runClient.
    compileOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}:api"
    localRuntime "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"

    implementation "com.bobby.bobbycore:bobbycore:${bobbycore_version}"

    // Optional sibling for pipes-vs-chests testing in runClient.
    localRuntime 'com.bobby.bobbychests:bobbychests:1.0.0'

    // Optional Just Dire Things: generators / energy for pipe testing.
    localRuntime "curse.maven:just-dire-things-1002348:${justdirethings_file}"

    // Optional Iron Tanks: tiered + creative fluid tanks for fluid pipe testing.
    localRuntime "maven.modrinth:iron-tanks:${irontanks_version}"

    // Optional Energized Power: fluid tanks, pumps, generators, battery boxes.
    localRuntime "maven.modrinth:energized-power:${energizedpower_version}"

    // Optional Ender IO: machines and conduits to test pipes against.
    localRuntime "maven.modrinth:enderio:${enderio_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def addLocalArtifacts(configurationName, dir, prefix = "extra-mods") {
    for (extraModJar in fileTree(dir: dir, include: '*.jar')) {
        def basename = extraModJar.name.substring(0, extraModJar.name.length() - ".jar".length())
        def versionSep = basename.lastIndexOf('-')
        assert versionSep != -1
        def artifactId = basename.substring(0, versionSep)
        def version = basename.substring(versionSep + 1)
        dependencies.add(configurationName, "${prefix}:$artifactId:$version")
    }
}

// --- Multiplayer handoff zip -------------------------------------------------
// Builds build/dist/bobbypipes-<version>-mp.zip with the mod jar (+ optional
// sibling bobbychests if already built) and a short install note. Wired to run
// before runClient / runServer so a fresh zip is ready to copy every launch.

def mpInstallNote = layout.buildDirectory.file('tmp/mp-install/INSTALL.txt')
def mpNoteText = """\
BobbyPipes multiplayer test pack
================================

Minecraft:  ${minecraft_version}
NeoForge:   ${neo_version}
Mod:        ${mod_id}-${mod_version}

On each machine (and the dedicated server, if any):
  1. Install NeoForge ${neo_version} for Minecraft ${minecraft_version}
  2. Copy everything from the mods/ folder into .minecraft/mods/
  3. Use the same mod set on client and server

JEI is included so the pattern-table "+" can paste ghost recipes.
Keep the pattern table open, look up a crafting recipe in JEI, click "+".

Jade, AE2, Refined Storage, Patchouli, and ComputerCraft:Tweaked are optional soft deps
(same idea as JEI) for tooling / guide / peripherals; they are not required to play BobbyPipes.
""".stripIndent()

tasks.register('writeMpInstallNote') {
    group = 'distribution'
    description = 'Writes INSTALL.txt for the multiplayer handoff zip.'
    outputs.file(mpInstallNote)
    def text = mpNoteText
    doLast {
        def note = mpInstallNote.get().asFile
        note.parentFile.mkdirs()
        note.text = text + "\nBuilt: ${new Date()}\n"
    }
}

tasks.register('packageModZip', Zip) {
    group = 'distribution'
    description = 'Zips the mod jar for copying to another computer (multiplayer testing).'
    dependsOn tasks.named('jar'), tasks.named('writeMpInstallNote')

    archiveFileName = "${mod_id}-${mod_version}-mp.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from(tasks.named('jar', Jar).flatMap { it.archiveFile }) {
        into 'mods'
    }

    // Sibling chests mod when a local build is already present (same localRuntime as runClient).
    def bobbyChestsLibs = ["${rootDir}/../BobbyChests/build/libs", "${rootDir}/../bobbychests/build/libs"]
            .collect { file(it) }
            .find { it.directory }
    if (bobbyChestsLibs != null) {
        from(fileTree(dir: bobbyChestsLibs,
                includes: ['*.jar'],
                excludes: ['*-sources.jar', '*-javadoc.jar', '*-slim.jar'])) {
            into 'mods'
        }
    }

    // Soft optional runtimes also useful when handing off a test pack.
    from(configurations.localRuntime) {
        into 'mods'
        include "jei-${minecraft_version}-neoforge-*.jar"
        include "Jade-*.jar", "jade-*.jar"
        include "appliedenergistics2-*.jar"
        include "guideme-*.jar"
        include "refinedstorage-neoforge-*.jar"
        include "refined-storage-243076-*.jar"
        exclude '*-api-*.jar', '*-sources.jar', '*-javadoc.jar'
    }

    from(mpInstallNote)

    doLast {
        logger.lifecycle("Multiplayer pack: ${archiveFile.get().asFile}")
    }
}

// Fresh zip before launching so you can copy it while the game is running.
['runClient', 'runClient2', 'runServer'].each { runName ->
    tasks.named(runName).configure {
        dependsOn tasks.named('packageModZip')
    }
}

// --- Modpack mods folder -----------------------------------------------------
// Every jar runClient loads, flattened into one directory to drop into a modpack
// instance: this mod, the sibling BobbyCore and BobbyChests builds, and every
// optional runtime. Unlike packageModZip this names nothing - it takes whatever
// localRuntime actually resolves to, so a new mod added to dependencies{} is
// picked up without editing a second include list.
//
//   ./gradlew collectMods                        -> build/modpack/mods
//   ./gradlew collectMods -Pmodpack.out=<dir>    -> <dir>
//
// The default output is a Sync, so repeat runs clear out jars left by an earlier
// version bump. An overridden output is a plain Copy instead: pointing a Sync at
// a real instance's mods/ folder would delete every other mod in it.

def modpackOverride = providers.gradleProperty('modpack.out').getOrNull()
def modpackDir = modpackOverride != null
        ? file(modpackOverride)
        : layout.buildDirectory.dir('modpack/mods').get().asFile

tasks.register('collectMods', modpackOverride != null ? Copy : Sync) {
    // Same group as runClient / runServer so it sits with them in `gradlew tasks` and in
    // the IDE Gradle panel - it is a "go play with this" task, not a release artifact.
    group = 'mod development'
    description = 'Copies every mod jar runClient loads into one folder for modpack testing.'
    dependsOn tasks.named('jar')

    into modpackDir

    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from(configurations.localRuntime)

    exclude '*-sources.jar', '*-javadoc.jar', '*-api.jar', '*-slim.jar'

    def target = modpackDir
    doLast {
        def jars = (target.listFiles() ?: [] as File[]).findAll { it.name.endsWith('.jar') }
        logger.lifecycle("${jars.size()} mod jars -> ${target}")
        jars.toSorted { it.name }.each { logger.lifecycle("  ${it.name}") }
    }
}
